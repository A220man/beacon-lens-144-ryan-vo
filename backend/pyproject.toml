[project]
name = "beacon-lens-backend"
version = "1.0.0"
description = "Beacon Lens Backend - AI Knowledge Platform API"
readme = "../README.md"
license = {text = "MIT"}
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["ai", "ml", "rag", "knowledge-base", "llm", "wiki", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.12",
    "sqlalchemy==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "pgvector==0.2.5",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "tenacity==8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ANN", "T20", "PTH", "RET", "PERF", "ARG", "SIM", "TID", "PL"]
ignore = ["ANN101", "ANN102", "ANN103", "T201", "T203", "PTH101", "PTH103", "PTH118"]